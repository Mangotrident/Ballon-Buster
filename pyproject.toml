[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-bioenergetics"
version = "0.1.0"
description = "Quantum Bioenergetics Mapping stack"
authors = [{name = "Quantum Bio Systems"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
addopts = "-q"
